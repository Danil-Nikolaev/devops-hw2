---
- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ __postgres_service }}"
    state: restarted
  become: true

- name: Restart postgres-exporter
  ansible.builtin.systemd_service:
    name: "{{ __exporter_service }}"
    state: restarted
  become: true

