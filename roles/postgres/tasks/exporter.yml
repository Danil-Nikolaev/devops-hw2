---
- name: Create postgres-exporter system user
  ansible.builtin.user:
    name: "{{ __exporter_os_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Download postgres-exporter on controller
  delegate_to: localhost
  become: false
  when: inventory_hostname == __first_host
  block:
    - name: Create exporter download directory
      ansible.builtin.file:
        path: "{{ __exporter_download_dir }}"
        state: directory
        mode: "0755"

    - name: Download and unpack postgres-exporter
      ansible.builtin.unarchive:
        src: "{{ __exporter_url }}"
        dest: "{{ __exporter_download_dir }}"
        remote_src: true
        creates: "{{ __exporter_download_dir }}/{{ __exporter_archive_name }}/postgres_exporter"

    - name: Register exporter executable path
      ansible.builtin.set_fact:
        __exporter_binary_local: >-
          {{ __exporter_download_dir }}/{{ __exporter_archive_name }}/postgres_exporter

- name: Propagate exporter executable path
  ansible.builtin.set_fact:
    __exporter_binary_source: "{{ hostvars[__first_host].__exporter_binary_local }}"

- name: Copy postgres-exporter executable
  ansible.builtin.copy:
    src: "{{ __exporter_binary_source }}"
    dest: "{{ __exporter_binary }}"
    owner: root
    group: root
    mode: "0755"
  notify:
    - Restart postgres-exporter

- name: Install postgres-exporter environment file
  ansible.builtin.template:
    src: postgres-exporter.env.j2
    dest: "{{ __exporter_env_file }}"
    owner: root
    group: "{{ __exporter_os_user }}"
    mode: "0640"
  no_log: true
  notify:
    - Restart postgres-exporter

- name: Install postgres-exporter systemd service
  ansible.builtin.template:
    src: postgres-exporter.service.j2
    dest: "/etc/systemd/system/{{ __exporter_service }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon reload
    - Restart postgres-exporter

- name: Apply exporter handlers before health checks
  ansible.builtin.meta: flush_handlers

- name: Enable and start postgres-exporter service
  ansible.builtin.systemd_service:
    name: "{{ __exporter_service }}"
    enabled: true
    state: started

